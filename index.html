  <style>
/* Appel AS — palette tirée d'un gymnase : sol bleu nuit, lignes de terrain colorées */
:root {
  --fond: #E9EEF2;
  --surface: #FFFFFF;
  --encre: #13233F;
  --gris: #5A6A80;
  --trait: #D3DBE4;
  --bleu: #1B6CA8;
  --P: #1F8A4C;
  --A: #C8323C;
  --R: #C47F00;
  --E: #6A5AA8;
  --titre: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --texte: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --rayon: 10px;
  --tab: 64px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--fond);
  color: var(--encre);
  font: 16px/1.45 var(--texte);
  padding-bottom: calc(var(--tab) + env(safe-area-inset-bottom, 0px) + 16px);
}
a { color: var(--bleu); }
h1, h2 { font-family: var(--titre); font-weight: 700; line-height: 1.1; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; }

/* ---------- Barre haute & onglets ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
  background: var(--encre); color: #fff;
}
.marque { color: #fff; text-decoration: none; font: 700 1.25rem/1 var(--titre); letter-spacing: .02em; }
.user { background: rgba(255,255,255,.12); border: 0; color: #fff; border-radius: 999px; padding: 6px 12px; font-size: .9rem; cursor: pointer; }
body:not(.connecte) .user, body:not(.connecte) .tabbar { display: none; }

.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(4, 1fr);
  height: calc(var(--tab) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface); border-top: 1px solid var(--trait);
}
.tabbar a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  text-decoration: none; color: var(--gris); font-size: .78rem;
}
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a.actif { color: var(--encre); font-weight: 700; box-shadow: inset 0 3px 0 var(--encre); }

main { max-width: 760px; margin: 0 auto; padding: 16px; }
.titre { font-size: 2rem; margin-bottom: 12px; }
.sous-titre { font-size: 1.4rem; margin: 28px 0 10px; }
.petit { font-size: .85rem; color: var(--gris); }
.gros { font-size: 1.1rem; font-weight: 700; margin: 4px 0; }
.vide { color: var(--gris); padding: 24px 0; text-align: center; list-style: none; }
.note { color: var(--R); font-size: .85rem; font-weight: 700; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 8px 16px; border-radius: var(--rayon);
  border: 1.5px solid var(--encre); background: var(--surface); color: var(--encre);
  font-weight: 700; text-decoration: none; cursor: pointer; white-space: nowrap;
}
.btn.primaire { background: var(--encre); color: #fff; }
.btn.grand { min-height: 54px; font-size: 1.05rem; padding: 12px 22px; }
.btn:disabled { opacity: .5; cursor: default; }
.lien { background: none; border: 0; padding: 0; color: var(--bleu); text-decoration: underline; cursor: pointer; }
.boutons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

input[type=search], input[type=date], select, textarea {
  min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--trait);
  border-radius: var(--rayon); background: var(--surface); width: 100%;
}
textarea { resize: vertical; margin-bottom: 8px; }

/* ---------- Connexion ---------- */
.login { text-align: center; padding: 48px 8px; max-width: 420px; margin: 0 auto; }
.login h1 { font-size: 2.8rem; margin-top: 24px; }
.login-sous { color: var(--gris); margin: 6px 0 32px; }
.login .petit { margin-top: 20px; }
/* Rond central d'un terrain, en lignes de couleur */
.login-terrain { width: 160px; height: 100px; margin: 0 auto; border: 3px solid var(--encre); border-radius: 6px; position: relative; }
.login-terrain::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 3px solid #D7263D; }
.login-terrain span { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); border: 3px solid #E0A100; border-radius: 50%; }

.vide-etat { text-align: center; padding: 48px 8px; }
.vide-etat h1 { font-size: 2rem; margin-bottom: 8px; }
.vide-etat p { color: var(--gris); margin-bottom: 20px; }

/* ---------- Appel ---------- */
.ligne-date { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 12px; }
.ligne-date label { font-weight: 700; }
.ligne-date input { width: auto; }

.puces { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.puces::-webkit-scrollbar { display: none; }
.puces button {
  flex: 0 0 auto; text-align: left; cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--trait); border-left: 6px solid var(--c);
  border-radius: 8px; padding: 6px 12px; min-height: 48px;
  display: flex; flex-direction: column; justify-content: center;
}
.puces button[aria-selected=true] { background: var(--encre); color: #fff; border-color: var(--encre); border-left-color: var(--c); }
.p-nom { font-weight: 700; font-size: .92rem; }
.p-h { font-size: .8rem; opacity: .8; }

/* L'en-tête de section façon tableau de marque, souligné de la couleur de sa ligne de terrain */
.entete-sec {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
  padding: 10px 0 12px; margin-bottom: 12px; border-bottom: 5px solid var(--c);
}
.entete-sec h1 { font-size: 2.3rem; }
.entete-sec p { margin: 2px 0 0; color: var(--gris); }
.score { font-family: var(--titre); font-weight: 700; line-height: .9; text-align: right; white-space: nowrap; }
.score b { font-size: 3.4rem; }
.score span { font-size: 1.6rem; color: var(--gris); }

.outils { display: flex; gap: 8px; margin-bottom: 6px; }
.outils input { flex: 1; }
.legende { font-size: .8rem; color: var(--gris); margin: 4px 0 10px; }

.liste-appel, .liste-eleves, .liste-jours, .liste-sections, .contacts, .creneaux, .histo-eleve, .jour-liste { list-style: none; margin: 0; padding: 0; }

.eleve-appel {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border-radius: var(--rayon); padding: 8px; margin-bottom: 6px;
  border-left: 5px solid transparent; transition: border-color .15s;
}
.eleve-appel.etat-P { border-left-color: var(--P); }
.eleve-appel.etat-A { border-left-color: var(--A); background: #FCF1F2; }
.eleve-appel.etat-R { border-left-color: var(--R); }
.eleve-appel.etat-E { border-left-color: var(--E); }
.qui { flex: 1; min-width: 0; display: grid; grid-template-columns: 44px 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; text-decoration: none; color: inherit; }
.qui .av { grid-row: span 2; }
.qui .noms { white-space: normal; overflow-wrap: anywhere; line-height: 1.2; }
.qui .nom, .qui .prenom { display: block; }
.qui .meta { margin-top: 3px; }
.noms { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nom { font-weight: 700; }
.meta { font-size: .82rem; color: var(--gris); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.hre { font-weight: 700; color: var(--R); }

.av { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.av-vide { background: var(--fond); color: var(--gris); font-weight: 700; font-size: .9rem; }

.marques { display: flex; gap: 4px; flex: 0 0 auto; }
.m {
  width: 38px; height: 44px; border-radius: 8px; cursor: pointer;
  border: 1.5px solid var(--trait); background: var(--surface); color: var(--gris);
  font: 700 1.05rem/1 var(--titre);
}
.m-P[aria-pressed=true] { background: var(--P); border-color: var(--P); color: #fff; }
.m-A[aria-pressed=true] { background: var(--A); border-color: var(--A); color: #fff; }
.m-R[aria-pressed=true] { background: var(--R); border-color: var(--R); color: #fff; }
.m-E[aria-pressed=true] { background: var(--E); border-color: var(--E); color: #fff; }

.dep { font-size: .74rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
.dep.seul { background: #E3F2E9; color: var(--P); }
.dep.recup { background: #FFF1D6; color: #8A5A00; }
.dep.ajoute { background: #E7ECF7; color: var(--bleu); }
.dep.alerte { background: #FBE3E5; color: var(--A); }

.ajout { margin: 14px 0; }
.ajout summary { cursor: pointer; color: var(--bleu); font-size: .92rem; }
.ajout-corps { display: flex; gap: 8px; margin-top: 8px; }
.ajout-corps select { flex: 1; min-width: 0; }

.barre-bilan {
  position: sticky; bottom: calc(var(--tab) + env(safe-area-inset-bottom, 0px) + 8px);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--surface); border: 1.5px solid var(--trait); border-radius: var(--rayon);
  padding: 8px 8px 8px 12px; box-shadow: 0 4px 14px rgba(19,35,63,.12);
}

const UTILISATEURS = [

];

// ---------- Lecture de l'export HelloAsso ----------
const { parseRows } = (() => {
// Lecture de l'export HelloAsso (xlsx/csv) -> élèves + sections.
// Module "pur" : aucune dépendance à Firebase, testable seul.

const norm = (s) =>
  String(s ?? '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/\s+/g, ' ').trim();

const slug = (s) => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

const pad = (n) => String(n).padStart(2, '0');

// Excel stocke parfois les numéros comme des nombres : le 0 initial disparaît.
function formatPhone(v) {
  if (v == null || v === '') return '';
  let d = String(v).replace(/\D/g, '');
  if (d.startsWith('0033')) d = '0' + d.slice(4);
  else if (d.length === 11 && d.startsWith('33')) d = '0' + d.slice(2);
  if (d.length === 9) d = '0' + d;
  if (d.length === 10) return d.replace(/(\d{2})(?=\d)/g, '$1 ');
  return String(v).trim();
}

const formatNom = (s) => String(s ?? '').trim().replace(/\s+/g, ' ').toUpperCase();

const formatPrenom = (s) =>
  String(s ?? '').trim().replace(/\s+/g, ' ').toLowerCase()
    .replace(/(^|[\s\-'])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());

const oui = (v) => norm(v) === 'oui';

// Date Excel (numéro de série), Date JS ou texte jj/mm/aaaa -> "aaaa-mm-jj"
function toISODate(v, withTime = false) {
  if (v == null || v === '') return '';
  let d = null;
  if (typeof v === 'number') {
    d = new Date(Math.round((v - 25569) * 86400000));
    const date = `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
    return withTime ? `${date}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}` : date;
  }
  if (v instanceof Date) {
    const date = `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`;
    return withTime ? `${date}T${pad(v.getHours())}:${pad(v.getMinutes())}` : date;
  }
  const m = String(v).match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})(?:\D+(\d{1,2}):(\d{2}))?/);
  if (m) {
    const date = `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    return withTime && m[4] ? `${date}T${pad(m[4])}:${m[5]}` : date;
  }
  const iso = String(v).match(/\d{4}-\d{2}-\d{2}/);
  return iso ? iso[0] : '';
}

// Colonnes reconnues par le début de leur intitulé (accents et casse ignorés)
const CHAMPS = [
  ['ref', 'reference commande'],
  ['dateCommande', 'date de la commande'],
  ['statut', 'statut de la commande'],
  ['nom', 'nom adherent'],
  ['prenom', 'prenom adherent'],
  ['nomPayeur', 'nom payeur'],
  ['prenomPayeur', 'prenom payeur'],
  ['emailPayeur', 'email payeur'],
  ['dateNaissance', 'date de naissance'],
  ['classe', 'classe'],
  ['telPere', 'telephone pere'],
  ['telMere', 'telephone mere'],
  ['emailParents', 'mail parents'],
  ['competition', 'participation competition'],
  ['commentaire', 'commentaire'],
];

// "Futsal compétition / mercredi de 12h30 à 13h30 Inscription après accord..."
function parseSectionHeader(h) {
  const raw = String(h).replace(/\s+/g, ' ').trim();
  const parts = raw.split(' / ');
  let first = parts[0];
  let rest = parts.slice(1).join(' / ');
  if (parts.length === 1) {
    const i = norm(raw).indexOf('mercredi');
    first = i > 0 ? raw.slice(0, i) : raw;
    rest = i > 0 ? raw.slice(i) : '';
  }
  const re = /(\d{1,2})\s*h\s*(\d{2})?\s*(?:à|a|-|–|—)\s*(\d{1,2})\s*h\s*(\d{2})?/i;
  const m = raw.match(re);
  const debut = m ? `${pad(m[1])}:${m[2] || '00'}` : '';
  const fin = m ? `${pad(m[3])}:${m[4] || '00'}` : '';
  const parens = [...first.matchAll(/\(([^)]*)\)/g)].map((x) => x[1].trim());
  const nom = first.replace(/\([^)]*\)/g, '').replace(/\s+/g, ' ').replace(/[\s,/-]+$/, '').trim();
  let apres = rest;
  const mr = rest.match(re);
  if (mr) apres = rest.slice(rest.indexOf(mr[0]) + mr[0].length);
  apres = apres.trim().replace(/^[\s,.:-]+/, '').replace(/^\((.*)\)$/, '$1').trim();
  const detail = [...parens, apres].filter(Boolean).join(' · ');
  return { id: slug(nom), nom, debut, fin, detail, colonne: raw };
}

/**
 * rows : tableau de lignes (la 1re = en-têtes), ex. XLSX.utils.sheet_to_json(ws, {header:1, raw:true})
 * Retourne { eleves, sections, ignores, colonnesManquantes }
 */
function parseRows(rows) {
  const lignes = rows.filter((r) => r && r.some((c) => c !== null && c !== ''));
  if (!lignes.length) throw new Error('Le fichier est vide.');
  const headers = lignes[0].map((h) => String(h ?? ''));
  const col = {};
  const sectionsCols = [];

  headers.forEach((h, i) => {
    const n = norm(h);
    if (!n) return;
    if (n.includes('rejoindre son domicile') || n.includes('rentrer seul')) {
      if (col.rentreSeul == null) col.rentreSeul = i;
      return;
    }
    const champ = CHAMPS.find(([k, key]) => col[k] == null && n.startsWith(key));
    if (champ) { col[champ[0]] = i; return; }
    if (n.includes('mercredi')) sectionsCols.push({ i, ...parseSectionHeader(h) });
  });

  const colonnesManquantes = ['nom', 'prenom'].filter((k) => col[k] == null);
  if (colonnesManquantes.length) {
    throw new Error("Colonnes « Nom adhérent » / « Prénom adhérent » introuvables : est-ce bien l'export HelloAsso ?");
  }

  const get = (r, k) => (col[k] == null ? null : r[col[k]]);
  const ignores = [];
  const parId = new Map();

  lignes.slice(1).forEach((r, idx) => {
    const ligne = idx + 2;
    const nom = formatNom(get(r, 'nom'));
    const prenom = formatPrenom(get(r, 'prenom'));
    if (!nom || !prenom) { ignores.push({ ligne, raison: 'Nom ou prénom vide' }); return; }
    const statut = String(get(r, 'statut') ?? '').trim();
    if (statut && norm(statut) !== 'valide') {
      ignores.push({ ligne, raison: `Commande « ${statut} » (${nom} ${prenom})` });
      return;
    }
    const dateNaissance = toISODate(get(r, 'dateNaissance'));
    const id = [slug(nom), slug(prenom), dateNaissance.replace(/-/g, '')].filter(Boolean).join('-');
    const payeur = [formatPrenom(get(r, 'prenomPayeur')), formatNom(get(r, 'nomPayeur'))].filter(Boolean).join(' ');
    const eleve = {
      id,
      nom,
      prenom,
      classe: String(get(r, 'classe') ?? '').trim().toUpperCase(),
      dateNaissance,
      telPere: formatPhone(get(r, 'telPere')),
      telMere: formatPhone(get(r, 'telMere')),
      emailParents: String(get(r, 'emailParents') ?? '').trim().toLowerCase(),
      emailPayeur: String(get(r, 'emailPayeur') ?? '').trim().toLowerCase(),
      payeur,
      competition: oui(get(r, 'competition')),
      rentreSeul: oui(get(r, 'rentreSeul')),
      sections: sectionsCols.filter((s) => oui(r[s.i])).map((s) => s.id),
      refCommande: String(get(r, 'ref') ?? ''),
      dateInscription: toISODate(get(r, 'dateCommande'), true),
      commentaire: String(get(r, 'commentaire') ?? '').trim(),
    };
    // Si un élève apparaît deux fois, la commande la plus récente l'emporte
    const prev = parId.get(id);
    if (!prev || (eleve.dateInscription || '') >= (prev.dateInscription || '')) parId.set(id, eleve);
  });

  const sections = sectionsCols
    .map(({ i, ...s }) => s)
    .sort((a, b) => (a.debut || '99').localeCompare(b.debut || '99') || a.nom.localeCompare(b.nom));

  return { eleves: [...parId.values()], sections, ignores, colonnesManquantes };
}

return { parseRows };
})();

/* ---------- Utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
const maintenant = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const pl = (n, mot) => `${n} ${mot}${n > 1 ? 's' : ''}`;

const dateLongue = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const dateCourte = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });

  if (!iso) return '';
  const n = new Date(iso + 'T12:00:00'), d = new Date();

const moi = () => UTILISATEURS.find((u) => u.email.toLowerCase() === (S.user?.email || '').toLowerCase());

/* ---------- État ---------- */
const S = {
  user: null,
  eleves: new Map(),
  sections: [],
  appels: new Map(),
  bilans: new Map(),
  meta: {},
  pret: false,
  date: todayISO(),
  sectionSel: null,
};

const STATUTS = {
  P: { label: 'Présent', court: 'P' },
  A: { label: 'Absent', court: 'A' },
  R: { label: 'En retard', court: 'R' },
  E: { label: 'Excusé', court: 'E' },
};
const PALETTE = ['#D7263D', '#1B6CA8', '#E0A100', '#2A9D5C', '#7B4BB7', '#E4572E', '#0E9AA7', '#8C6D46'];

const section = (id) => S.sections.find((s) => s.id === id);
const elevesActifs = () => [...S.eleves.values()].filter((e) => e.actif !== false);
const trier = (a, b) => a.nom.localeCompare(b.nom, 'fr') || a.prenom.localeCompare(b.prenom, 'fr');
const membres = (secId) => elevesActifs().filter((e) => (e.sections || []).includes(secId)).sort(trier);
const appelId = (date, secId) => `${date}_${secId}`;

function listeAppel(date, secId) {
  const ap = S.appels.get(appelId(date, secId));
  const ids = new Set(membres(secId).map((e) => e.id));
  Object.keys(ap?.presences || {}).forEach((id) => ids.add(id));
  return [...ids].map((id) => S.eleves.get(id)).filter(Boolean).sort(trier);
}

function sectionsDe(e) {
  return (e.sections || []).map(section).filter(Boolean).sort((a, b) => (a.debut || '').localeCompare(b.debut || ''));
}

function depart(e) {
  const fin = sectionsDe(e).map((s) => s.fin).filter(Boolean).sort().pop() || '';
  return { fin, seul: !!e.rentreSeul };
}

function conflits(e) {
  const secs = sectionsDe(e);
  const res = [];
  for (let i = 0; i < secs.length; i++)
    for (let j = i + 1; j < secs.length; j++)
      if (secs[i].debut && secs[j].debut && secs[i].debut < secs[j].fin && secs[j].debut < secs[i].fin) res.push([secs[i], secs[j]]);
  return res;
}

function compter(date, secId) {
  const ap = S.appels.get(appelId(date, secId));
  const liste = listeAppel(date, secId);
  const c = { P: 0, A: 0, R: 0, E: 0, non: 0, total: liste.length };
  liste.forEach((e) => { const st = ap?.presences?.[e.id]; if (st && c[st] != null) c[st]++; else c.non++; });
  return c;
}

const initiales = (e) => (e.prenom?.[0] || '') + (e.nom?.[0] || '');
const avatar = (e, cls = 'av') =>
  e.photoThumb
    ? `<img class="${cls}" src="${e.photoThumb}" alt="">`
    : `<span class="${cls} av-vide" aria-hidden="true">${esc(initiales(e))}</span>`;

const puceDepart = (e) =>
  e.rentreSeul
    ? `<span class="dep seul">Rentre seul</span>`
    : `<span class="dep recup">À récupérer</span>`;

/* ---------- Authentification ---------- */
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

async function connexion() {
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) {
      await signInWithRedirect(auth, provider);
    } else if (e.code !== 'auth/popup-closed-by-user') {
      toast('Connexion impossible : ' + (e.code || e.message), 'err');
    }
  }
}

getRedirectResult(auth).catch((e) => toast('Connexion impossible : ' + (e.code || e.message), 'err'));

onAuthStateChanged(auth, (u) => {
  desabonnements.forEach((f) => f());
  desabonnements = [];
  S.user = u;
  if (!u) return ecranConnexion();
  if (!autorise(u)) return ecranRefus(u);
  document.body.classList.add('connecte');
  $('#userBtn').textContent = moi()?.nom || u.displayName || u.email;
  ecouter();
  route();
});

function ecranConnexion() {
  document.body.classList.remove('connecte');
  $('#view').innerHTML = `
    <section class="login">
      <div class="login-terrain" aria-hidden="true"><span></span></div>
      <h1>Appel de l'AS</h1>
      <p class="login-sous">Collège Yves du Manoir · Vaucresson</p>
      <button id="btnLogin" class="btn primaire grand">Se connecter avec Google</button>
      <p class="petit">Accès réservé aux enseignants de l'association sportive.</p>
    </section>`;
  $('#btnLogin').onclick = connexion;
}

function ecranRefus(u) {
  document.body.classList.remove('connecte');
  $('#view').innerHTML = `
    <section class="login">
      <h1>Accès refusé</h1>
      <p>Le compte <b>${esc(u.email)}</b> n'est pas autorisé. Connectez-vous avec le compte Gmail enregistré pour l'AS.</p>
      <button id="btnOut" class="btn primaire grand">Changer de compte</button>
    </section>`;
  $('#btnOut').onclick = () => signOut(auth);
}

$('#userBtn').onclick = () => {
  if (confirm(`Se déconnecter (${S.user?.email}) ?`)) signOut(auth);
};

/* ---------- Données temps réel ---------- */
function erreurDonnees(e) {
  console.error(e);
  toast(e.code === 'permission-denied' ? 'Accès aux données refusé : vérifiez les règles Firestore.' : 'Erreur de synchronisation : ' + e.message, 'err');
}

function ecouter() {
  const recu = { eleves: false, sections: false, appels: false };
  const fini = (k) => { recu[k] = true; S.pret = Object.values(recu).every(Boolean); rafraichir(); };
  desabonnements.push(
    onSnapshot(collection(db, 'eleves'), (snap) => {
      S.eleves = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
      fini('eleves');
    }, erreurDonnees),
    onSnapshot(collection(db, 'sections'), (snap) => {
      S.sections = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.debut || '99').localeCompare(b.debut || '99') || a.nom.localeCompare(b.nom));
      fini('sections');
    }, erreurDonnees),
    onSnapshot(collection(db, 'appels'), (snap) => {
      S.appels = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
      fini('appels');
    }, erreurDonnees),
    onSnapshot(collection(db, 'bilans'), (snap) => {
      S.bilans = new Map(snap.docs.map((d) => [d.id, d.data()]));
      rafraichir();
    }, erreurDonnees),
    onSnapshot(doc(db, 'config', 'meta'), (d) => { S.meta = d.data() || {}; rafraichir(); }, erreurDonnees),
  );
}

/* ---------- Routeur ---------- */
const ROUTES = { appel: vueAppel, eleves: vueEleves, eleve: vueFiche, historique: vueHistorique, jour: vueJour, import: vueImport };

function route() {
  if (!autorise(S.user)) return;
  const [nom, param] = (location.hash.slice(1) || 'appel').split('/');
  const f = ROUTES[nom] || vueAppel;
  vue = f(decodeURIComponent(param || ''));
  vue.render($('#view'));
  const onglet = { eleve: 'eleves', jour: 'historique' }[nom] || nom;
  document.querySelectorAll('.tabbar a').forEach((a) => a.classList.toggle('actif', a.dataset.tab === onglet));
  window.scrollTo(0, 0);
}

function rafraichir() {
  if (!vue) return;
  if (vue.update) return vue.update();
  const y = window.scrollY;
  vue.render($('#view'));
  window.scrollTo(0, y);
}

window.addEventListener('hashchange', route);

const chargement = () => `<p class="vide">Chargement…</p>`;

function vueAppel() {
  let recherche = '';
  let el;

  const secCourante = () => {
    if (S.sectionSel && section(S.sectionSel)) return S.sectionSel;
    const t = maintenant();
    const s = S.sections.find((s) => s.debut <= t && t < s.fin) || S.sections.find((s) => t < s.debut) || S.sections[0];
    return s?.id || null;
  };

  async function marquer(maj) {
    const secId = secCourante();
    const ref = doc(db, 'appels', appelId(S.date, secId));
    const presences = {}, heures = {};
    for (const [id, st] of Object.entries(maj)) {
      presences[id] = st || deleteField();
      heures[id] = st ? maintenant() : deleteField();
    }
    try {
      await setDoc(ref, {
        date: S.date, sectionId: secId, presences, heures,
        par: arrayUnion(moi()?.nom || S.user.email), majLe: serverTimestamp(),
      }, { merge: true });
    } catch (e) { erreurDonnees(e); }
  }

  function render(root) {
    el = root;
    root.innerHTML = `
      <section class="appel">
        <div class="ligne-date">
          <label for="dateAppel">Séance du</label>
          <input type="date" id="dateAppel" value="${S.date}">
          <span id="noteDate" class="note"></span>
        </div>
        <div class="puces" id="puces" role="tablist" aria-label="Sections"></div>
        <div id="enteteSec"></div>
        <div class="outils" id="outils">
          <input type="search" id="q" placeholder="Rechercher un élève" autocomplete="off">
          <button id="tousP" class="btn">Tous présents</button>
        </div>
        <p class="legende" id="legende">P présent · A absent · R en retard · E excusé. Toucher à nouveau pour annuler.</p>
        <ul class="liste-appel" id="liste"></ul>
        <details class="ajout" id="ajout"></details>
        <div class="barre-bilan" id="barreBilan"></div>
      </section>`;

    $('#dateAppel', root).onchange = (ev) => { S.date = ev.target.value || todayISO(); update(); };
    $('#q', root).oninput = (ev) => { recherche = ev.target.value; majListe(); };
    $('#tousP', root).onclick = () => {
      const ap = S.appels.get(appelId(S.date, secCourante()));
      const maj = {};
      listeAppel(S.date, secCourante()).forEach((e) => { if (!ap?.presences?.[e.id]) maj[e.id] = 'P'; });
      if (!Object.keys(maj).length) return toast('Tous les élèves sont déjà pointés.');
      marquer(maj);
      toast(`${pl(Object.keys(maj).length, 'élève')} marqué${Object.keys(maj).length > 1 ? 's' : ''} présent${Object.keys(maj).length > 1 ? 's' : ''}`);
    };
    $('#puces', root).onclick = (ev) => {
      const b = ev.target.closest('[data-sec]');
      if (!b) return;
      S.sectionSel = b.dataset.sec;
      update();
    };
    $('#liste', root).onclick = (ev) => {
      const b = ev.target.closest('button[data-st]');
      if (!b) return;
      const ap = S.appels.get(appelId(S.date, secCourante()));
      const actuel = ap?.presences?.[b.dataset.id];
      marquer({ [b.dataset.id]: actuel === b.dataset.st ? null : b.dataset.st });
    };
    update();
  }

  function majListe() {
    const secId = secCourante();
    const ap = S.appels.get(appelId(S.date, secId));
    const q = recherche.trim().toLowerCase();
    const liste = listeAppel(S.date, secId).filter((e) => !q || `${e.nom} ${e.prenom} ${e.classe}`.toLowerCase().includes(q));
    const inscrits = new Set(membres(secId).map((e) => e.id));
    $('#liste', el).innerHTML = liste.map((e) => {
      const st = ap?.presences?.[e.id] || '';
      const hre = st === 'R' ? ap?.heures?.[e.id] : '';
      return `
        <li class="eleve-appel ${st ? 'etat-' + st : ''}">
          <a class="qui" href="#eleve/${encodeURIComponent(e.id)}">
            ${avatar(e)}
            <span class="noms"><span class="nom">${esc(e.nom)}</span> <span class="prenom">${esc(e.prenom)}</span></span>
            <span class="meta">${esc(e.classe)} ${e.rentreSeul ? '' : puceDepart(e)}${inscrits.has(e.id) ? '' : ' <span class="dep ajoute">Ajouté</span>'}${hre ? ` <span class="hre">${h(hre)}</span>` : ''}</span>
          </a>
          <div class="marques" role="group" aria-label="Statut de ${esc(e.prenom)} ${esc(e.nom)}">
            ${Object.entries(STATUTS).map(([k, v]) =>
              `<button data-id="${esc(e.id)}" data-st="${k}" class="m m-${k}" aria-pressed="${st === k}" title="${v.label}" aria-label="${v.label}">${v.court}</button>`).join('')}
          </div>
        </li>`;
    }).join('') || `<li class="vide">${q ? 'Aucun élève ne correspond.' : 'Aucun élève inscrit dans cette section.'}</li>`;
  }

  function update() {
    if (!el) return;
    if (!$('#puces', el)) { if (S.sections.length) render(el); return; }
    if (!S.pret) { $('#liste', el).innerHTML = chargement(); return; }
    if (!S.sections.length) {
      el.innerHTML = `<section class="vide-etat"><h1>Aucune section</h1><p>Importez l'export HelloAsso pour créer les sections et la liste des élèves.</p><a class="btn primaire" href="#import">Importer les inscriptions</a></section>`;
      return;
    }
    const secId = secCourante();
    const s = section(secId);
    $('#noteDate', el).textContent = estMercredi(S.date) ? '' : "Ce n'est pas un mercredi";
    $('#puces', el).innerHTML = S.sections.map((x) => {
      const c = compter(S.date, x.id);
      return `<button role="tab" data-sec="${x.id}" aria-selected="${x.id === secId}" style="--c:${x.couleur}">
        <span class="p-nom">${esc(x.nom)}</span><span class="p-h">${h(x.debut)}${c.total ? ` · ${c.P + c.R}/${c.total}` : ''}</span></button>`;
    }).join('');
    const ap = S.appels.get(appelId(S.date, secId));
    const c = compter(S.date, secId);
    const heureMaj = ap?.majLe?.toDate ? ap.majLe.toDate().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
    $('#enteteSec', el).innerHTML = `
      <header class="entete-sec" style="--c:${s.couleur}">
        <div>
          <h1>${esc(s.nom)}</h1>
          <p>${h(s.debut)} – ${h(s.fin)}${s.detail ? ' · ' + esc(s.detail) : ''}</p>
          ${ap ? `<p class="petit">Appel par ${esc((ap.par || []).join(', '))}${heureMaj ? ' · mis à jour à ' + heureMaj : ''}</p>` : ''}
        </div>
        <div class="score" aria-label="${c.P + c.R} présents sur ${c.total}"><b>${c.P + c.R}</b><span>/${c.total}</span></div>
      </header>`;
    majListe();

    const dansListe = new Set(listeAppel(S.date, secId).map((e) => e.id));
    const autres = elevesActifs().filter((e) => !dansListe.has(e.id)).sort(trier);
    const ajout = $('#ajout', el);
    const ouvert = ajout.open;
    ajout.innerHTML = `
      <summary>Ajouter un élève non inscrit sur cette section</summary>
      <div class="ajout-corps">
        <select id="selAjout"><option value="">Choisir un élève…</option>
          ${autres.map((e) => `<option value="${esc(e.id)}">${esc(e.nom)} ${esc(e.prenom)} (${esc(e.classe)})</option>`).join('')}

        <button class="btn" id="btnAjout">Ajouter présent</button>
      </div>`;
    ajout.open = ouvert;
    $('#btnAjout', el).onclick = () => {
      const id = $('#selAjout', el).value;
      if (!id) return;
      marquer({ [id]: 'P' });
      toast('Élève ajouté à cet appel');
    };

    $('#barreBilan', el).innerHTML = `
      <div class="compteurs">
        <span class="k-P">${pl(c.P, 'présent')}</span><span class="k-A">${pl(c.A, 'absent')}</span>
        ${c.R ? `<span class="k-R">${pl(c.R, 'retard')}</span>` : ''}${c.E ? `<span class="k-E">${pl(c.E, 'excusé')}</span>` : ''}
        ${c.non ? `<span class="k-non">${c.non} non pointé${c.non > 1 ? 's' : ''}</span>` : ''}
      </div>
      <a class="btn primaire" href="#jour/${S.date}">Bilan du jour</a>`;
  }

  return { render, update };
}

async function redimensionner(file, max, qualite, carre = false) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
    if (carre) { const c = Math.min(sw, sh); sx = (sw - c) / 2; sy = (sh - c) / 3; sw = sh = c; }
    const k = Math.min(1, max / Math.max(sw, sh));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(sw * k);
    canvas.height = Math.round(sh * k);
    canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', qualite);
  } finally {
    URL.revokeObjectURL(url);
  }
}

        <div class="bloc">
          <h2>Présences</h2>
          ${total ? `<p class="gros">${taux} % de présence <span class="petit">(${nb.P} présent, ${nb.R} retard, ${nb.A} absent, ${nb.E} excusé)</span></p>` : '<p class="petit">Aucun appel enregistré pour cet élève.</p>'}
          <ul class="histo-eleve">
            ${historique.map((a) => {
              const s = section(a.sectionId);
              const st = a.presences[id];
              return `<li><span>${dateCourte(a.date)}</span><span style="--c:${s?.couleur || '#999'}" class="h-sec">${esc(s?.nom || a.sectionId)}</span><span class="st st-${st}">${STATUTS[st].label}</span></li>`;
            }).join('')}
          </ul>
        </div>
      </section>`;

    majPhoto();
    $('#inPhoto', root).onchange = envoyerPhoto;
    $('#btnNotes', root).onclick = async () => {
      try {
        await setDoc(doc(db, 'eleves', id), { notes: $('#notes', root).value.trim() }, { merge: true });
        toast('Notes enregistrées');
      } catch (err) { erreurDonnees(err); }
    };
    const supp = $('#suppPhoto', root);
    if (supp) supp.onclick = async () => {
      if (!confirm('Supprimer la photo de cet élève ?')) return;
      await deleteDoc(doc(db, 'photos', id));
      await setDoc(doc(db, 'eleves', id), { photoThumb: deleteField(), photoAt: deleteField() }, { merge: true });
      photo = null;
      toast('Photo supprimée');
    };
  }

  function majPhoto() {
    const e = S.eleves.get(id);
    const zone = el && $('#photoImg', el);
    if (!zone || !e) return;
    if (photo) zone.innerHTML = `<img class="photo-img" src="${photo}" alt="Photo de ${esc(e.prenom)}">`;
  }

  async function envoyerPhoto(ev) {
    const file = ev.target.files?.[0];
    if (!file) return;
    toast('Traitement de la photo…');
    try {
      // Grande photo (fiche) dans une collection à part, vignette dans la fiche élève
      const grande = await redimensionner(file, 900, 0.8);
      const vignette = await redimensionner(file, 120, 0.75, true);
      await setDoc(doc(db, 'photos', id), { data: grande, majLe: serverTimestamp(), par: moi()?.nom || '' });
      await setDoc(doc(db, 'eleves', id), { photoThumb: vignette, photoAt: serverTimestamp() }, { merge: true });
      photo = grande;
      majPhoto();
      toast('Photo enregistrée');
    } catch (err) {
      console.error(err);
      toast("La photo n'a pas pu être enregistrée : " + err.message, 'err');
    }
  }

  return {
    render,
    update() {
      // Ne pas effacer une note en cours de saisie
      if (el && document.activeElement?.id === 'notes') return;
      const y = window.scrollY;
      render(el);
      window.scrollTo(0, y);
    },
  };
}

/* ======================================================
   HISTORIQUE
   ====================================================== */
function datesAvecAppel() {
  return [...new Set([...S.appels.values()].map((a) => a.date))].sort().reverse();
}

function vueHistorique() {
  return {
    render(root) {
      if (!S.pret) { root.innerHTML = chargement(); return; }
      const dates = datesAvecAppel();
      root.innerHTML = `
        <section>
          <h1 class="titre">Historique</h1>
          <div class="outils"><button class="btn" id="exportTout" ${dates.length ? '' : 'disabled'}>Exporter tout l'historique (CSV)</button></div>
          <ul class="liste-jours">
            ${dates.map((d) => {
              const b = S.bilans.get(d);
              return `<li><a href="#jour/${d}" class="jour">
                <span class="j-date">${dateLongue(d)}</span>
                <span class="j-secs">${S.sections.filter((s) => S.appels.has(appelId(d, s.id))).map((s) => {
                  const c = compter(d, s.id);
                  return `<span style="--c:${s.couleur}">${esc(s.nom)} <b>${c.P + c.R}/${c.total}</b>${c.A ? ` · ${c.A} abs.` : ''}</span>`;
                }).join('')}</span>
                ${b ? `<span class="petit envoye">Bilan envoyé au CPE par ${esc(b.par)}</span>` : ''}
              </a></li>`;
            }).join('') || `<li class="vide">Aucun appel enregistré pour l'instant.</li>`}
          </ul>
        </section>`;
      $('#exportTout', root).onclick = () => telecharger(`presences-AS-${todayISO()}.csv`, csv(lignesCSV(dates)));
    },
  };
}

function lignesCSV(dates) {
  const lignes = [['Date', 'Section', 'Horaire', 'Nom', 'Prénom', 'Classe', 'Statut', 'Heure pointage', 'Rentre seul']];
  [...dates].sort().forEach((d) => S.sections.forEach((s) => {
    const ap = S.appels.get(appelId(d, s.id));
    if (!ap) return;
    listeAppel(d, s.id).forEach((e) => {
      const st = ap.presences?.[e.id];
      lignes.push([d, s.nom, `${h(s.debut)}-${h(s.fin)}`, e.nom, e.prenom, e.classe, st ? STATUTS[st].label : 'Non pointé', ap.heures?.[e.id] || '', e.rentreSeul ? 'Oui' : 'Non']);
    });
  }));
  return lignes;
}

function bilanTexte(date) {
  const nomE = (e) => `${e.nom} ${e.prenom} (${e.classe})`;
  const blocs = [];
  let totP = 0, totA = 0;
  S.sections.forEach((s) => {
    const ap = S.appels.get(appelId(date, s.id));
    if (!ap) return;
    const liste = listeAppel(date, s.id);
    const g = { P: [], A: [], R: [], E: [], non: [] };
    liste.forEach((e) => (g[ap.presences?.[e.id]] || g.non).push(e));
    totP += g.P.length + g.R.length;
    totA += g.A.length;
    let t = `■ ${s.nom} (${h(s.debut)} – ${h(s.fin)})\n`;
    t += `Effectif présent : ${g.P.length + g.R.length} / ${liste.length}\n`;
    if (g.A.length) t += `Absents (${g.A.length}) :\n${g.A.map((e) => '  - ' + nomE(e)).join('\n')}\n`;
    if (g.R.length) t += `En retard (${g.R.length}) :\n${g.R.map((e) => `  - ${nomE(e)}, arrivé à ${h(ap.heures?.[e.id])}`).join('\n')}\n`;
    if (g.E.length) t += `Excusés (${g.E.length}) :\n${g.E.map((e) => '  - ' + nomE(e)).join('\n')}\n`;
    if (g.non.length) t += `Non pointés (${g.non.length}) :\n${g.non.map((e) => '  - ' + nomE(e)).join('\n')}\n`;
    if (g.P.length) t += `Liste des présents : ${g.P.map(nomE).join(', ')}\n`;
    t += `Appel réalisé par ${(ap.par || []).join(', ')}.\n`;
    blocs.push(t);
  });
  return {
    sujet: `AS – Présences du ${dateLongue(date)}`,
    corps: `Bonjour,\n\nVoici le bilan des présences de l'${ETABLISSEMENT} pour le ${dateLongue(date)}.\n` +
      `Total : ${pl(totP, 'présence')}, ${pl(totA, 'absence')}.\n\n${blocs.join('\n')}\nBonne journée,\n${moi()?.nom || ''}`,
  };
}

function vueJour(date) {
  return {
    render(root) {
      if (!S.pret) { root.innerHTML = chargement(); return; }
      const secs = S.sections.filter((s) => S.appels.has(appelId(date, s.id)));
      const b = S.bilans.get(date);
      const { sujet, corps } = bilanTexte(date);
      root.innerHTML = `
        <section>
          <a class="retour" href="#historique">‹ Historique</a>
          <h1 class="titre">${dateLongue(date)}</h1>
          ${secs.length ? '' : `<p class="vide">Aucun appel ce jour-là. <a href="#appel">Faire l'appel</a></p>`}
          ${secs.map((s) => {
            const ap = S.appels.get(appelId(date, s.id));
            const liste = listeAppel(date, s.id);
            return `
              <div class="bloc jour-sec" style="--c:${s.couleur}">
                <h2>${esc(s.nom)} <span class="petit">${h(s.debut)} – ${h(s.fin)}</span></h2>
                <ul class="jour-liste">
                  ${liste.map((e) => {
                    const st = ap.presences?.[e.id];
                    return `<li><a href="#eleve/${encodeURIComponent(e.id)}">${esc(e.nom)} ${esc(e.prenom)}</a><span class="petit">${esc(e.classe)}</span><span class="st st-${st || 'non'}">${st ? STATUTS[st].label : 'Non pointé'}${st === 'R' ? ' ' + h(ap.heures?.[e.id]) : ''}</span></li>`;
                  }).join('')}
                </ul>
                <p class="petit">Appel par ${esc((ap.par || []).join(', '))}</p>
              </div>`;
          }).join('')}
          ${secs.length ? `
            <div class="bloc envoi">
              <h2>Envoyer le bilan au CPE</h2>
              <p class="petit">Destinataire : ${esc(EMAIL_CPE)}${b ? ` · déjà envoyé par ${esc(b.par)} le ${b.le?.toDate ? b.le.toDate().toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : ''}` : ''}</p>
              <div class="boutons">
                <a class="btn primaire" id="envGmail" target="_blank" rel="noopener"
                   href="https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(EMAIL_CPE)}&su=${encodeURIComponent(sujet)}&body=${encodeURIComponent(corps)}">Ouvrir dans Gmail</a>
                <a class="btn" id="envMail" href="mailto:${EMAIL_CPE}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(corps)}">Autre appli mail</a>
                <button class="btn" id="copier">Copier le texte</button>
                <button class="btn" id="csvJour">CSV du jour</button>
              </div>
              <details><summary>Aperçu du mail</summary><pre class="apercu">${esc(corps)}</pre></details>
            </div>` : ''}
        </section>`;
      if (!secs.length) return;
      const noterEnvoi = () => setDoc(doc(db, 'bilans', date), { par: moi()?.nom || S.user.email, le: serverTimestamp() }).catch(erreurDonnees);
      $('#envGmail', root).onclick = noterEnvoi;
      $('#envMail', root).onclick = noterEnvoi;
      $('#copier', root).onclick = async () => {
        try { await navigator.clipboard.writeText(`${sujet}\n\n${corps}`); toast('Bilan copié'); }
        catch { toast('Copie impossible sur cet appareil', 'err'); }
      };
      $('#csvJour', root).onclick = () => telecharger(`presences-AS-${date}.csv`, csv(lignesCSV([date])));
    },
  };
}

/* ======================================================
   IMPORT HELLOASSO
   ====================================================== */
const LIBELLES = {
  nom: 'Nom', prenom: 'Prénom', classe: 'Classe', dateNaissance: 'Date de naissance', telPere: 'Tél. père', telMere: 'Tél. mère',
  emailParents: 'Mail parents', emailPayeur: 'Mail payeur', payeur: 'Payeur', competition: 'Compétition', rentreSeul: 'Rentre seul',
  sections: 'Sections', commentaire: 'Commentaire', refCommande: 'Commande',
};

function vueImport() {
  let el, analyse = null;

  function render(root) {
    el = root;
    root.innerHTML = `
      <section class="import">
        <h1 class="titre">Importer les inscriptions</h1>
        <ol class="etapes">
          <li>Sur HelloAsso, exportez les inscriptions de la campagne AS 2026-2027 <b>depuis le début de la saison</b> (pas seulement la dernière semaine).</li>
          <li>Choisissez le fichier .xlsx ci-dessous : les nouveaux élèves sont ajoutés, les autres mis à jour. Les photos et notes sont conservées.</li>
        </ol>
        <label class="btn primaire grand fichier">Choisir le fichier HelloAsso
          <input type="file" id="inFichier" accept=".xlsx,.xls,.csv" hidden>
        </label>
        <div id="apercu"></div>
        <h2 class="sous-titre">Sections</h2>
        <ul class="liste-sections" id="listeSections"></ul>
        <p class="petit" id="dernierImport"></p>
      </section>`;
    $('#inFichier', root).onchange = lireFichier;
    $('#listeSections', root).onclick = renommer;
    update();
  }

  function update() {
    if (!el) return;
    $('#listeSections', el).innerHTML = S.sections.map((s) => `
      <li style="--c:${s.couleur}"><span><b>${esc(s.nom)}</b> <span class="petit">${h(s.debut)} – ${h(s.fin)} · ${membres(s.id).length} élèves</span></span>
      <button class="lien" data-ren="${s.id}">Renommer</button></li>`).join('') || '<li class="vide">Les sections seront créées au premier import.</li>';
    const li = S.meta.dernierImport;
    $('#dernierImport', el).textContent = li
      ? `Dernier import : ${li.le?.toDate ? li.le.toDate().toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : ''} par ${li.par} (${li.fichier}) : ${li.nouveaux} nouveaux, ${li.maj} mis à jour.`
      : '';
  }

  async function renommer(ev) {
    const b = ev.target.closest('[data-ren]');
    if (!b) return;
    const s = section(b.dataset.ren);
    const nom = prompt('Nouveau nom de la section', s.nom);
    if (nom && nom.trim()) await setDoc(doc(db, 'sections', s.id), { nom: nom.trim() }, { merge: true });
  }

  async function lireFichier(ev) {
    const f = ev.target.files?.[0];
    if (!f) return;
    const zone = $('#apercu', el);
    zone.innerHTML = '<p class="vide">Lecture du fichier…</p>';
    try {
      const XLSX = await import('https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs');
      const wb = XLSX.read(await f.arrayBuffer());
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: null });
      const res = parseRows(rows);
      const idsFichier = new Set(res.eleves.map((e) => e.id));
      const nouveaux = [], modifies = [];
      res.eleves.forEach((e) => {
        const ex = S.eleves.get(e.id);
        if (!ex) return nouveaux.push(e);
        const champs = Object.keys(LIBELLES).filter((k) => JSON.stringify(ex[k] ?? '') !== JSON.stringify(e[k] ?? ''));
        if (champs.length || ex.actif === false) modifies.push({ e, champs });
      });
      const absents = elevesActifs().filter((e) => !idsFichier.has(e.id));
      const nouvellesSections = res.sections.filter((s) => !section(s.id));
      analyse = { res, nouveaux, modifies, absents, fichier: f.name };

      zone.innerHTML = `
        <div class="bloc apercu-import">
          <h2>${esc(f.name)}</h2>
          <p class="gros">${res.eleves.length} inscrits lus : ${nouveaux.length} nouveaux, ${modifies.length} à mettre à jour, ${res.eleves.length - nouveaux.length - modifies.length} inchangés.</p>
          ${nouvellesSections.length ? `<p>Nouvelles sections : ${nouvellesSections.map((s) => `<b>${esc(s.nom)}</b> (${h(s.debut)} – ${h(s.fin)})`).join(', ')}</p>` : ''}
          ${nouveaux.length ? `<details open><summary>Nouveaux élèves (${nouveaux.length})</summary><ul>${nouveaux.map((e) => `<li>${esc(e.nom)} ${esc(e.prenom)} · ${esc(e.classe)}</li>`).join('')}</ul></details>` : ''}
          ${modifies.length ? `<details><summary>Mises à jour (${modifies.length})</summary><ul>${modifies.map(({ e, champs }) => `<li>${esc(e.nom)} ${esc(e.prenom)} : ${champs.map((c) => LIBELLES[c]).join(', ') || 'réactivé'}</li>`).join('')}</ul></details>` : ''}
          ${res.ignores.length ? `<details><summary>Lignes ignorées (${res.ignores.length})</summary><ul>${res.ignores.map((i) => `<li>Ligne ${i.ligne} : ${esc(i.raison)}</li>`).join('')}</ul></details>` : ''}
          ${absents.length ? `
            <div class="absents">
              <p>${absents.length} élève(s) de l'application ne figurent pas dans ce fichier : ${absents.map((e) => esc(`${e.nom} ${e.prenom}`)).join(', ')}.</p>
              <label><input type="checkbox" id="desactiver"> Les retirer des listes d'appel (désinscrits). Leur historique est conservé.</label>
            </div>` : ''}
          <div class="boutons">
            <button class="btn primaire" id="valider">Valider l'import</button>
            <button class="btn" id="annuler">Annuler</button>
          </div>
        </div>`;
      $('#valider', el).onclick = valider;
      $('#annuler', el).onclick = () => { zone.innerHTML = ''; analyse = null; ev.target.value = ''; };
    } catch (err) {
      console.error(err);
      zone.innerHTML = `<p class="alerte-txt">Import impossible : ${esc(err.message)}</p>`;
    }
    ev.target.value = '';
  }

  async function valider() {
    const { res, nouveaux, modifies, absents, fichier } = analyse;
    const desactiver = $('#desactiver', el)?.checked;
    const ops = [];
    const couleursPrises = new Set(S.sections.map((s) => s.couleur));
    res.sections.forEach((s, i) => {
      const ex = section(s.id);
      const data = { nomOriginal: s.nom, debut: s.debut, fin: s.fin, detail: s.detail, colonne: s.colonne, ordre: i };
      if (!ex) {
        data.nom = s.nom;
        data.couleur = PALETTE.find((c) => !couleursPrises.has(c)) || PALETTE[i % PALETTE.length];
        couleursPrises.add(data.couleur);
      }
      ops.push([doc(db, 'sections', s.id), data]);
    });
    const aEcrire = [...nouveaux.map((e) => ({ e, neuf: true })), ...modifies.map(({ e }) => ({ e, neuf: false }))];
    aEcrire.forEach(({ e, neuf }) => {
      const { id, ...data } = e;
      ops.push([doc(db, 'eleves', id), { ...data, actif: true, source: 'helloasso', majImport: serverTimestamp(), ...(neuf ? { creeLe: serverTimestamp() } : {}) }]);
    });
    if (desactiver) absents.forEach((e) => ops.push([doc(db, 'eleves', e.id), { actif: false }]));
    ops.push([doc(db, 'config', 'meta'), {
      dernierImport: { le: serverTimestamp(), par: moi()?.nom || S.user.email, fichier, nouveaux: nouveaux.length, maj: modifies.length },
    }]);

    const btn = $('#valider', el);
    btn.disabled = true;
    btn.textContent = 'Import en cours…';
    try {
      for (let i = 0; i < ops.length; i += 450) {
        const batch = writeBatch(db);
        ops.slice(i, i + 450).forEach(([ref, data]) => batch.set(ref, data, { merge: true }));
        await batch.commit();
      }
      $('#apercu', el).innerHTML = `<p class="succes">Import terminé : ${nouveaux.length} nouveaux, ${modifies.length} mis à jour${desactiver ? `, ${absents.length} retirés des listes` : ''}.</p>`;
      toast('Import terminé');
    } catch (err) {
      erreurDonnees(err);
      btn.disabled = false;
      btn.textContent = "Valider l'import";
    }
  }

  return { render, update };
}

</script>
</body>
